databases:
  - name: codigo-del-cafe-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: codigo-del-cafe
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node srv/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL_APP
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
      - key: DOMINIO_INSTITUCIONAL
        value: "@monicaherrera.edu.sv"
      - key: NODE_ENV
        value: production
      # NODE_VERSION (asegura que Render use Node moderno, necesario para import.meta)
      - key: NODE_VERSION
        value: "18.x"
